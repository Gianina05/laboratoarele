<DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JavaScript current day and time</title>
<h1>
 program to check if a number is  prime or not 
</h1>
</head>
<body>

<script type="text/javascript">
//take input from the user 
const number = parseInt(prompt("Enter a positive number: "));
let isPrime = true;

//check if number is equal to 1
if (number === 1) {
   console.log("1 is neither prime nor composite number.");
}

//check if number is greater than 1
else if (number > 1) {
  //looping trough 2 to number-1
 for (let i = 2; i < number; i++) {
	if (number % i == 0) {
		isPrime = false;
 	break;
	}
}
	if (is Prime) {
		console.log(`${number} is a prime number `);
}else {
	console.log(`${number} is not a  prime number `);
	}
}
//check if number is less than 1
else {
	console.log("The number is not a prime number.");
}
</script>
</body>
</html>


<Doctype html>
<html>
<head>
<meta charset="utf-8">
<title>JavaScript current day and time</title>
	<h1>
	 program to create a countdown timer
	</h1>
	</head>
<body>

<script type="text/javascript'>

//time to countdown from (in milliseconds)
let countDownDate = new Date().getTime90 = 24 * 60 * 60 * 1000;
// countdown timer
let x = setInterval(function() {
	//get today's date and time in milliseconds 
let now = new Date().getTime();
//find the interval between now and the countdown time 
let timeLeft =  countDownDate - now;
//time calculation for days , hours, minutes and seconds 
	const days = Math.floor( timeLeft/(1000*60*60*24) );
	const hours = Math.floor( timeLeft/(1000*60*60)) % 24 );
	const minutes = Math.floor( timeLeft/1000/60) % 60 );
	const seconds = Math.floor( timeLeft/1000) % 60 );

//display the result in the element with id="demo"
console.log(days + "d " + hours + "h " + minutes + "m " + seconds + "s ");
// clearing countdown when complete 
if (timeLeft < 0) {
	clearInterval(x);
console.log('countDown Finished');
}
},2000);
</script>
</body>
</html>
