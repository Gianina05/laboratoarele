<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JavaScript Quadratic Equation Solver</title>
<h1>This program computes roots of a quadratic equation when its coefficients are known.</h1>
<p>The standard form of a quadratic equation is: ax<sup>2</sup> + bx + c = 0, where a ≠ 0, b, and c are real numbers.</p>
</head>
<body>

<script type="text/javascript">
// Program to solve a quadratic equation
let root1, root2;

// Take input from the user
let a = parseFloat(prompt("Enter the value of a (coefficient of ): "));
let b = parseFloat(prompt("Enter the value of b (coefficient of ): "));
let c = parseFloat(prompt("Enter the value of c (constant term): "));

// Calculate the discriminant
let discriminant = b * b - 4 * a * c;

// If discriminant is greater than 0, the roots are real and different
if (discriminant > 0) {
    root1 = (-b + Math.sqrt(discriminant)) / (2 * a);
    root2 = (-b - Math.sqrt(discriminant)) / (2 * a);

    // Display results
    console.log(`The roots of the quadratic equation are ${root1} and ${root2}`);
}
// If discriminant is 0, the roots are real and equal
else if (discriminant == 0) {
    root1 = root2 = -b / (2 * a);

    // Display results
    console.log(`The roots of the quadratic equation are ${root1} and ${root2}`);
}
// If discriminant is less than 0, the roots are complex
else {
    let realPart = (-b / (2 * a)).toFixed(2);
    let imaginaryPart = (Math.sqrt(-discriminant) / (2 * a)).toFixed(2);

    // Display results
    console.log(`The roots of the quadratic equation are ${realPart} + ${imaginaryPart}i and ${realPart} - ${imaginaryPart}i`);
}
</script>

</body>
</html>
